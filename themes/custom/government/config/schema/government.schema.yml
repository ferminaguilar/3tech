government.settings:
  type: theme_settings
  label: 'Government theme settings'
  mapping:
    cdn_provider:
      type: string
      label: 'CDN Provider'
    cdn_custom_img:
      type: string
      label: 'USWDS Image URL'
    cdn_custom_css:
      type: string
      label: 'USWDS CSS URL'
    cdn_custom_css_min:
      type: string
      label: 'Minified USWDS CSS URL'
    cdn_custom_js:
      type: string
      label: 'USWDS JavaScript URL'
    cdn_custom_js_min:
      type: string
      label: 'Minified USWDS JavaScript URL'
    uswds_header_style:
      type: string
      label: 'Header Style'
    uswds_header_logo_height:
      type: string
      label: 'Max Header Logo Height'

    uswds_header_mega:
      type: boolean
      label: 'Use megamenus'
    uswds_header_mega_display_second:
      type: boolean
      label: 'Display second level as headers'
    uswds_government_banner:
      type: boolean
      label: 'Display official U.S. government banner'
    uswds_footer_style:
      type: string
      label: 'Footer Style'
    uswds_footer_agency:
      type: boolean
      label: 'Add agency information'
    uswds_footer_agency_show_logo:
      type: boolean
      label: 'Display footer agency logo'

    uswds_footer_agency_name:
      type: string
      label: 'Footer agency name'
    uswds_footer_agency_url:
      type: string
      label: 'Footer agency URL'
    uswds_footer_agency_logo:
      type: string
      label: 'Path to footer agency logo'
    uswds_contact_center:
      type: string
      label: 'Name of contact center'
    uswds_email:
      type: string
      label: 'Email'
    uswds_phone:
      type: string
      label: 'Phone'
    uswds_facebook:
      type: string
      label: 'Facebook link'
    uswds_instagram:
      type: string
      label: 'Instagram link'
    uswds_linkedin:
      type: string
      label: 'LinkedIn link'
    uswds_twitter:
      type: string
      label: 'Twitter link'
    uswds_youtube:
      type: string
      label: 'YouTube link'
    uswds_rss:
      type: string
      label: 'RSS feed'
    uswds_paragraphs_edge_to_edge:
      type: boolean
      label: 'Paragraphs edge to edge'
    uswds_menu_accordion_duplicate_parent:
      type: boolean
      label: 'Duplicate parent menu items'
    uswds_menu_bypass:
      type: sequence
      label: 'Bypass USWDS menu processing'
      sequence:
        type: string
    uswds_identifier_enabled:
      type: boolean
      label: 'Display USWDS Identifier component'
    uswds_identifier_variant:
      type: string
      label: 'Identifier Variant'
    uswds_identifier_show_logos:
      type: boolean
      label: 'Display agency logos'
    uswds_identifier_taxpayer_disclaimer:
      type: boolean
      label: 'Include Taxpayer Disclaimer'


    uswds_identifier_domain:
      type: string
      label: 'Domain name'

    uswds_identifier_agency_name:
      type: string
      label: 'Parent Agency / Department Name'
    uswds_identifier_agency_short_name:
      type: string
      label: 'Agency Acronym / Short Name'
    uswds_identifier_agency_url:
      type: string
      label: 'Parent Agency URL'
    uswds_identifier_agency_logo:
      type: string
      label: 'Agency Logo Path'
    uswds_identifier_parent2_name:
      type: string
      label: 'Secondary Parent Agency Name'
    uswds_identifier_parent2_url:
      type: string
      label: 'Secondary Parent Agency URL'
    uswds_identifier_parent2_logo:
      type: string
      label: 'Secondary Agency Logo Path'
    uswds_identifier_usagov_enabled:
      type: boolean
      label: 'Display USA.gov section'
    uswds_identifier_usagov_text:
      type: string
      label: 'USA.gov Disclaimer Text'
    uswds_identifier_usagov_url:
      type: string
      label: 'USA.gov URL'