---
deployment:
  tasks:
    - export DEPLOYPATH=/home/fermpgjg/3tech.io
    - /bin/rsync -a --exclude='.git' ./ $DEPLOYPATH/
    - test -f $DEPLOYPATH/sites/default/settings.php || cp $DEPLOYPATH/sites/default/default.settings.php $DEPLOYPATH/sites/default/settings.php
    - find $DEPLOYPATH -type d -exec chmod 755 {} +
    - find $DEPLOYPATH -type f -exec chmod 644 {} +
    - cd $DEPLOYPATH && ./vendor/bin/drush updb -y || true
    - cd $DEPLOYPATH && ./vendor/bin/drush cim -y || true
    - cd $DEPLOYPATH && ./vendor/bin/drush cr || true
