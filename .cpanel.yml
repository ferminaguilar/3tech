---
deployment:
  tasks:
    - export DEPLOYPATH=/home/fermpgjg/3tech.io
    - export PATH=/opt/cpanel/ea-php83/root/usr/bin:$PATH
    - export COMPOSER_MEMORY_LIMIT=-1
    - /bin/rsync -a --exclude='.git' ./ $DEPLOYPATH/
    - test -f $DEPLOYPATH/sites/default/settings.php || cp $DEPLOYPATH/sites/default/default.settings.php $DEPLOYPATH/sites/default/settings.php
    - chmod -R 755 $DEPLOYPATH/core $DEPLOYPATH/vendor $DEPLOYPATH/sites/default || true
    - cd $DEPLOYPATH && composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
    - cd $DEPLOYPATH && ./vendor/bin/drush updb -y
    - cd $DEPLOYPATH && ./vendor/bin/drush cim -y
    - cd $DEPLOYPATH && ./vendor/bin/drush cr


