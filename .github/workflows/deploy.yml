name: Deploy to Namecheap Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Namecheap
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 21098 }}
          script: |
            echo "=== 1. Updating Server Repository ==="
            cd /home/fermpgjg/repositories/3tech
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            echo "=== 2. Syncing Files to Live Website ==="
            export DEPLOYPATH=/home/fermpgjg/3tech.io
            export PATH=/opt/cpanel/ea-php83/root/usr/bin:$HOME/bin:/usr/local/bin:$PATH
            export COMPOSER_MEMORY_LIMIT=-1
            /bin/rsync -a --exclude='.git' --exclude='sites/default/files' --exclude='sites/default/settings.local.php' ./ $DEPLOYPATH/
            
            echo "=== 3. Running Drupal Updates & Config Import ==="
            cd $DEPLOYPATH
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --ignore-platform-reqs
            ./vendor/bin/drush updb -y
            ./vendor/bin/drush cim -y
            ./vendor/bin/drush cr
            
            echo "=== Deployment Completed Successfully! ==="