name: Deploy to Namecheap Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Deploy to Namecheap
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp >/dev/null 2>&1
          fi

          FTP_HOST="${FTP_SERVER:-ftp.fermin.host}"

          # 1. Sync government theme files & assets to production in parallel
          echo "Syncing government theme assets to production..."
          lftp -c "
            set ssl:verify-certificate no
            set ftp:passive-mode true
            set net:timeout 10
            set net:max-retries 2
            set net:connection-limit 2
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST 21
            mirror -R --only-newer --parallel=2 --exclude-glob node_modules/ themes/custom/government 3tech.io/themes/custom/government
            bye
          "

          # 2. Check changed git files
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="HEAD~1"
          fi
          
          git diff --name-only --diff-filter=ACMR "$before" "$GITHUB_SHA" > raw_changed_files.txt || true
          grep -v -E '^\.github/|^\.git/|\.DS_Store' raw_changed_files.txt > changed_files.txt || true

          # 3. Build & mirror Composer dependencies if composer changed
          if grep -qE '^composer\.(json|lock)' changed_files.txt || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Composer dependencies changed. Running composer install..."
            composer install --no-dev --optimize-autoloader
            
            echo "Syncing core and vendor to production..."
            lftp -c "
              set ssl:verify-certificate no
              set ftp:passive-mode true
              set net:timeout 10
              set net:max-retries 2
              set net:connection-limit 2
              open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST 21
              mirror -R --only-newer --parallel=2 core 3tech.io/core
              mirror -R --only-newer --parallel=2 vendor 3tech.io/vendor
              bye
            "
          fi

          # 4. Upload any other changed Git files
          if [ -s changed_files.txt ]; then
            echo "Uploading changed Git files..."
            STAGE_DIR="$(mktemp -d)"
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                mkdir -p "$STAGE_DIR/$(dirname "$file")"
                cp -a "$file" "$STAGE_DIR/$file"
              fi
            done < changed_files.txt

            lftp -c "
              set ssl:verify-certificate no
              set ftp:passive-mode true
              set net:timeout 10
              set net:max-retries 2
              set net:connection-limit 2
              open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST 21
              mirror -R --only-newer --parallel=2 \"$STAGE_DIR\" 3tech.io
              bye
            "
          fi

          echo "Deployment finished successfully."
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}



