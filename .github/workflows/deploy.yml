name: Deploy to Namecheap cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger cPanel Deployment via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Execute cPanel Deploy Command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          script: |
            cd /home/fermpgjg/repositories/3tech
            git pull origin main
            /usr/local/cpanel/bin/git-repo-deploy --repository=/home/fermpgjg/repositories/3tech
